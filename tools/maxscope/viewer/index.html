<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MaxScope</title><script src="/theme.js"></script><link rel="stylesheet" href="/style.css">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">M</span><span>MaxScope</span></a>
    <div class="library-title"><span>Runs</span><button id="refresh" class="icon" title="Refresh local logs" aria-label="Refresh local logs">↻</button></div>
    <input id="search" type="search" placeholder="Find a run…" aria-label="Find a run">
    <button id="short-toggle" class="text-button short-toggle" hidden></button>
    <div id="runs" class="runs" aria-label="Recorded runs"></div>
    <div class="sidebar-foot"><span class="status-dot"></span>Offline</div>
  </aside>
  <main>
    <header><div class="title-block"><h1 id="run-title">Log review</h1><p id="run-file"></p></div>
      <div class="header-actions"><span id="run-status" class="pill" hidden></span>
        <button id="overlay-open" class="button" aria-haspopup="dialog" aria-controls="overlay-picker" hidden>Overlay runs</button>
        <button id="theme-toggle" class="button" type="button"></button><label class="button primary" for="file">Open WPILOG<input id="file" type="file" accept=".wpilog" class="file-input"></label></div></header>
    <div id="notice" class="notice" role="status" hidden></div>
    <section id="welcome" class="welcome"><p>Select a run or open a WPILOG file.</p></section>
    <div id="workspace" hidden>
      <section class="transport card" aria-label="Playback controls"><button id="play" class="play" aria-label="Play" disabled>▶</button><div class="clock"><span id="time" class="time">0.00 s</span><span id="phase" class="phase" hidden></span></div><div class="scrub-wrap"><input id="scrub" type="range" min="0" max="1" step="0.001" value="0" aria-label="Playback time"><div id="scrub-markers" class="scrub-markers" aria-hidden="true"></div><div id="phase-marks" class="phase-marks" aria-hidden="true"></div></div><span id="duration" class="duration">0.00 s</span><select id="speed" aria-label="Playback speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select><button id="problems-toggle" class="problems-toggle" aria-pressed="false" title="Scan this run for problems · [ and ] step between them">Find problems</button></section>
      <section id="overlay-bar" class="overlay-bar" aria-label="Overlay runs" hidden>
        <span class="overlay-this"><span class="overlay-swatch this-run">A</span>This run</span>
        <div id="overlay-chips" class="overlay-chips"></div>
        <select id="overlay-align" aria-label="Line the overlay runs up at"><option value="start">Align at op-mode start</option><option value="motion">Align at first movement</option><option value="log">Align at log start</option></select>
        <button id="overlay-clear-all" class="text-button">Clear</button>
      </section>
      <div class="tab-row">
      <nav class="view-tabs" role="tablist" aria-label="Log views">
        <button id="tab-field" role="tab" aria-controls="panel-field" aria-selected="true" tabindex="0" data-view="field">Field</button>
        <button id="tab-signals" role="tab" aria-controls="panel-signals" aria-selected="false" tabindex="-1" data-view="signals">Signals</button>
        <button id="tab-events" role="tab" aria-controls="panel-events" aria-selected="false" tabindex="-1" data-view="events">Events</button>
      </nav>
      <div class="tab-actions"><select id="add-view" aria-label="Add view to current tab"><option value="">+ View</option><option value="field">Field</option><option value="signals">Signals</option><option value="commands">Commands</option><option value="events">Events</option><option value="gamepads">Gamepads</option><option value="camera">Camera</option></select></div>
      </div>
      <section id="panel-field" class="view-panel" role="tabpanel" aria-labelledby="tab-field">
        <section class="card field-card"><div class="card-heading"><h3 title="Pedro coordinates, inches. Origin at the audience-left corner, +X right, +Y away from the audience. Click the field to jump to when the robot was there.">Field</h3><a id="field-3d" class="text-button field-3d-link" href="/3d" target="maxscope-3d" title="Experimental: this run on a 3D field, in its own tab">3D ↗</a><label class="field-command-toggle" title="BIOBUZZ field elements: HIVES, FLOWERS, LOADING ZONES, GARDENS and tile names (2026-27 manual, ±1 in.)"><input id="field-elements-toggle" type="checkbox" checked aria-label="Show BIOBUZZ field elements">BIOBUZZ</label><label class="field-command-toggle"><input id="field-commands-toggle" type="checkbox" checked aria-label="Show active commands on field">Commands</label><label id="field-ball-option" class="field-command-toggle" hidden><input id="field-ball-toggle" type="checkbox" checked aria-label="Show tracked ball direction on field">Ball</label></div>
          <div id="field-activity" class="field-activity"><span class="field-activity-heading">Running</span><div id="field-active-commands" aria-label="Active commands on field"></div></div>
          <div class="field-wrap"><canvas id="field" aria-label="Robot field playback in native Pedro coordinates"></canvas><span id="pose-status" class="field-status"></span><span id="field-hint" class="field-status field-hint" role="status" hidden></span><span id="field-zoom" class="field-status field-zoom" hidden><span id="field-zoom-label"></span><button id="field-zoom-reset" class="text-button">Follow playback</button></span><span id="ball-status" class="field-status ball-status" hidden></span></div>
          <div class="pose-readouts"><div>X <strong id="pose-x">—</strong><small>in</small></div><div>Y <strong id="pose-y">—</strong><small>in</small></div><div>Heading <strong id="pose-h">—</strong><small>°</small></div></div>
          <div id="overlay-poses" class="overlay-poses" hidden></div>
          <div class="field-caption"><span id="field-size"></span></div>
        </section>
        <section id="metrics" class="metrics" aria-label="Run summary"></section>
      </section>
      <section id="panel-signals" class="view-panel" role="tabpanel" aria-labelledby="tab-signals" hidden>
        <section class="card signals-card"><div class="card-heading"><h3 title="Click to seek · Scroll to zoom · Drag to pan · F follows playback">Signals</h3><button id="add-graph" class="channel-select">+ Graph</button>
          <span class="window-controls" role="group" aria-label="Graph window"><button data-window="5" aria-pressed="false">5 s</button><button data-window="10" aria-pressed="true">10 s</button><button data-window="30" aria-pressed="false">30 s</button><button data-window="all" aria-pressed="false">All</button></span><button id="follow" class="button follow" title="Put the graphs back on the playback cursor (F)" hidden>Follow playback</button></div>
          <div id="charts"></div>
        </section>
      </section>
      <section id="view-storage" hidden>
        <section class="card"><div class="card-heading"><h3>Commands</h3><span id="coverage" class="pill"></span></div><p id="coverage-note" class="section-note"></p><div id="active" class="active-commands"></div><div id="commands" class="commands"></div></section>
      </section>
      <section id="panel-events" class="view-panel" role="tabpanel" aria-labelledby="tab-events" hidden>
        <section class="card"><div class="card-heading"><h3>Events</h3><select id="event-filter" aria-label="Event filter"><option value="all">All events</option><option value="faults">Faults & warnings</option></select></div><div id="events" class="events"></div></section>
      </section>
      <section hidden>
      <section class="card problems-card"><div class="card-heading"><h3 title="Flagged from logged channels: battery under 9.5 V, loops over 50 ms, disconnects, localizer faults, pose jumps over 3 in, fault events and failed commands. [ and ] step between them.">Problems</h3><span id="problem-count" class="pill"></span><span class="problem-nav"><button id="problem-prev" class="text-button" title="Previous problem ( [ )">‹ Prev</button><button id="problem-next" class="text-button" title="Next problem ( ] )">Next ›</button></span></div>
        <div id="problem-kinds" class="problem-kinds"></div><div id="problems" class="problems"></div></section>
      <section class="card inputs-card"><div class="card-heading"><h3 title="Stick values after deadband">Gamepads</h3></div><div id="gamepads" class="gamepads"></div></section>
      </section>
    </div>
  </main>
  <dialog id="channel-picker" aria-labelledby="picker-title">
    <div class="picker-heading"><h2 id="picker-title">Choose a signal</h2><button id="picker-close" class="icon" aria-label="Close signal picker">×</button></div>
    <input id="channel-search" type="search" placeholder="Search channels…" aria-label="Search channels" autocomplete="off">
    <div id="channel-tree" class="channel-tree" aria-label="Channel folders"></div>
    <p class="picker-note">Layer up to 8 signals · One scale per unit</p>
    <div class="picker-footer"><span id="channel-count" class="muted"></span><button id="channel-clear" class="text-button">Clear graph</button></div>
  </dialog>
  <dialog id="overlay-picker" class="overlay-picker" aria-labelledby="overlay-title">
    <div class="picker-heading"><h2 id="overlay-title">Overlay runs</h2><button id="overlay-close" class="icon" aria-label="Close overlay picker">×</button></div>
    <input id="overlay-search" type="search" placeholder="Search runs…" aria-label="Search runs" autocomplete="off">
    <div id="overlay-list" class="overlay-list"></div>
    <div class="picker-footer"><span class="muted">Up to 4 runs · <span id="overlay-count"></span></span><button id="overlay-clear" class="text-button">Clear all</button></div>
  </dialog>
  <script type="module" src="/app.js"></script>
</body>
</html>
