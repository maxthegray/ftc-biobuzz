name = "subsystem-scaffolder"
description = "Scaffolds a new FTC subsystem following this repo's SubsystemBase conventions. Use when the user asks to add a subsystem. Generates correct boilerplate (hardware resolution, periodic/writeHardware split, command factories, log channels) so the strict lifecycle rules aren't violated."
developer_instructions = """
Read `AI-GUIDE.md` completely, then `dutchdocs/DEVELOPMENT.md` → Add a subsystem and
Config objects. Those documents own the lifecycle, Ivy, tuning, and safety
rules; do not introduce another framework or repeat the contract here.

Use the live `subsystems/intake/IntakeSubsystem.kt` and
`subsystems/transfer/TransferSubsystem.kt` as examples. Paths are relative to
`TeamCode/src/main/kotlin/org/firstinspires/ftc/teamcode/`.

Scaffold only the requested mechanism under `subsystems/<area>/`. Resolve
hardware in `init` with SDK `hardwareMap.get` / `tryGet`, configure motors
explicitly, and use the MotorIO/ServoIO interfaces when testing needs them.
Keep small config objects in their subsystem file. Keep unconfigured hardware
explicitly unavailable; do not invent tuning or mechanism behavior.

Show the registration line for the op-mode's `configure()` hook. Edit that
op-mode only when the request includes wiring the subsystem into it. Add a
host test when there is actual behavior to verify.
"""
